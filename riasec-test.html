<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIASEC Профориентационный тест</title>
    <link rel="icon" type="image/png" href="logos/UA_block_rgb-CARD_0.png 1.png">
    <link rel="stylesheet" href="riasec-style.css?v=2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="test-container">
        <!-- Test Questions -->
        <section id="test-section" class="section">
            <div class="language-selector">
                <button class="lang-btn active" data-lang="ru" onclick="switchLanguage('ru')">Русский</button>
                <button class="lang-btn" data-lang="kk" onclick="switchLanguage('kk')">Қазақша</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <p class="progress-text">Вопрос <span id="currentQuestion">1</span> из <span id="totalQuestions">11</span></p>

            <form id="testForm">
                <!-- Questions will be injected by JavaScript -->
                <div id="questionsContainer"></div>

                <div class="button-group">
                    <button type="button" id="prevBtn" class="btn-secondary" style="visibility: hidden;">Назад</button>
                    <button type="button" id="nextBtn" class="btn-primary">Далее</button>
                    <button type="submit" id="submitBtn" class="btn-primary" style="display: none;">Завершить тест</button>
                </div>
            </form>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="section">
            <div class="header-logos">
                <img src="logos/arizona-logo-ku.svg" alt="Kozybayev University" class="logo">
                <img src="logos/arizona-logo-arizona.png" alt="University of Arizona" class="logo">
                <img src="logos/ertis academy logo vertical for alfacrm.png" alt="Ertis Academy" class="logo">
            </div>

            <h1 id="resultsTitle">Результаты теста</h1>

            <div class="results-card">
                <div class="riasec-code">
                    <h2 id="yourTypeTitle">Ваш тип личности RIASEC:</h2>
                    <div class="code-display" id="riasecCode"></div>
                    <p class="code-description" id="codeDescription"></p>
                </div>

                <div class="scores-chart" id="scoresChart"></div>

                <div class="majors-list">
                    <h3 id="recommendedMajorsTitle">Рекомендуемые специальности:</h3>
                    <div id="majorsList"></div>
                </div>

                <div class="ent-analysis">
                    <h3 id="entAnalysisTitle">Анализ профильных предметов:</h3>
                    <p id="entAnalysis"></p>
                </div>

                <button id="downloadPdfBtn" class="btn-primary btn-large">
                    📄 Скачать результаты в PDF
                </button>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>Kozybayev University | Arizona University<br>Career Vision | 2025</p>
        </div>
    </footer>

    <script src="version.js"></script>
    <script src="riasec.js"></script>
</body>
</html>
